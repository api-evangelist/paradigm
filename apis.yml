aid: paradigm
name: Paradigm
description: >-
  Paradigm is a research-driven, frontier-technology investment firm founded in 2018 by Coinbase
  co-founder Fred Ehrsam and former Sequoia Capital partner Matt Huang. Headquartered in San Francisco
  with offices in New York and Washington, DC, the firm began as one of the largest crypto-focused
  venture funds and has since expanded to build and invest across crypto, AI, robotics, and other
  technical frontiers "from first check through to public markets." Paradigm is unusual in that it is both
  a builder and an investor: alongside its fund it ships open-source software (Reth, Foundry, Alloy,
  Artemis) and incubates companies. The firm has made 130+ investments and reported roughly $12.7B in
  assets under management as of April 2025; it raised a $2.5B first venture fund in 2021 and announced a
  new $1.2B fund in July 2026 aimed at the "technical frontier" including AI and robotics. Notable
  portfolio companies and protocols include Uniswap, Coinbase, Stripe, Optimism, Chainalysis, Fireblocks,
  Blur, Monad, Kalshi, and Zipline. Managing partners include Matt Huang and Alana Palmedo.
